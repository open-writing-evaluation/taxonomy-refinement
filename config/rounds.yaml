# Round definitions: run-id -> taxonomy version, spec, samples.
# Version staging, fixed before any run: T1 (judgment-based domain
# assignment, LEX:* refinements, WO dual-use), T2 (LEX:* pruned;
# M/U/WO=>SYNT convention; R still judgment-based), T3 = endpoint
# (full inventory + deterministic domain rule + packaging guidelines).
# Scripts read this file to resolve the taxonomy version of a run id.
rounds:
  r1:
    taxonomy: T1
    spec: specs/T1_taxonomy.md
    samples: [data/samples/d_ref.jsonl, data/samples/d_test.jsonl]
  r2:
    taxonomy: T2
    spec: specs/T2_taxonomy.md
    samples: [data/samples/d_ref.jsonl, data/samples/d_test.jsonl]
  r3:
    taxonomy: T3
    spec: specs/T3_taxonomy.md
    samples: [data/samples/d_ref.jsonl, data/samples/d_test.jsonl]
  ctrl:
    taxonomy: T1P
    spec: specs/T1plus_taxonomy.md
    samples: [data/samples/d_ref.jsonl, data/samples/d_test.jsonl]

# Within-model reliability floor: repeat runs (30_annotate.py --tag _rep2)
# at both endpoints. All five annotators are re-run, so the floor bounds the
# noisiest panelist rather than assuming within-class homogeneity of the
# temperature-0 models.
repeat_runs:
  r1: [claude, gpt, qwen, deepseek, kimi]
  r3: [claude, gpt, qwen, deepseek, kimi]

# Human adjudication subset H: drawn once from d_test strata with a fixed
# seed, then adjudicated blind under the final version T3 by two coders
# (see outputs/adjudication/two_coder_protocol.md). Round-2 panel labels
# are scored against the same consensus through the logged crosswalk.
adjudication:
  h_n: 150
  seed: 20260717
  source: data/samples/d_test.jsonl
